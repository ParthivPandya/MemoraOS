[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoraos"
version = "0.2.0"
description = "Local-first adaptive memory engine for AI agents: hybrid retrieval, temporal facts, evidence-grounded answers, and a reproducible benchmark lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MemoraOS contributors" }]
keywords = ["ai", "memory", "agents", "rag", "knowledge-graph", "temporal"]
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "pydantic>=2.5",
    "httpx>=0.25",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
memoraos = "memoraos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]

[tool.bandit]
# B608: every dynamic SQL fragment in this codebase is built from internal constants (table names,
# "?" placeholder lists); all values are bound parameters. Enforced by tests/security.
skips = ["B608"]
