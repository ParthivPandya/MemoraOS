name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Prefer a concrete scenario (questions and expected answers).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: measure
    attributes:
      label: How would we measure success?
      description: Which benchmark scenario would show improvement (or a new one)?
